<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>四年级升五年级暑期学习工作台 - 信阳五年级新教材</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #eaf4fc;
  --card: #ffffff;
  --primary: #4a9eff;
  --primary-light: #e3f2fd;
  --primary-dark: #1976d2;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --success: #4caf50;
  --warning: #ff9800;
  --danger: #f44336;
  --radius: 18px;
  --nav-w: 84px;
  --nav-w-expand: 200px;
}
html, body { height: 100%; font-family: "Microsoft YaHei", -apple-system, "PingFang SC", sans-serif; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); overflow: hidden; }

/* 布局 */
.app { display: flex; height: 100vh; height: 100dvh; }
.sidebar {
  width: var(--nav-w);
  background: linear-gradient(180deg, #4a9eff 0%, #1976d2 100%);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; flex-shrink: 0; overflow-y: auto; overflow-x: hidden;
  transition: width 0.3s; position: relative;
}
.sidebar::-webkit-scrollbar { width: 0; }
.nav-logo { font-size: 28px; margin: 6px 0 14px; }
.nav-item {
  width: 60px; padding: 10px 4px; margin-bottom: 4px;
  border-radius: 14px; text-align: center; cursor: pointer;
  color: rgba(255,255,255,0.8); transition: all 0.25s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.nav-item .icon { font-size: 22px; line-height: 1; }
.nav-item .label { font-size: 10px; line-height: 1.2; }
.nav-item:hover { background: rgba(255,255,255,0.15); color: #fff; }
.nav-item.active { background: #fff; color: var(--primary-dark); font-weight: 600; }
.nav-divider { width: 40px; height: 1px; background: rgba(255,255,255,0.2); margin: 8px 0; }
.pet-mini { text-align: center; color: #fff; padding: 6px; }
.pet-mini .pet-emoji { font-size: 26px; }
.pet-mini .pet-lvl { font-size: 10px; opacity: 0.9; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: #fff; padding: 12px 20px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 2px solid var(--primary-light);
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); min-height: 64px;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.day-badge {
  background: linear-gradient(135deg, #4a9eff, #1976d2); color: #fff;
  padding: 8px 16px; border-radius: 14px; font-size: 16px; font-weight: 700;
}
.date-info { color: var(--text-light); font-size: 13px; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.points-box {
  background: var(--primary-light); color: var(--primary-dark);
  padding: 8px 16px; border-radius: 14px; font-weight: 700; font-size: 15px;
  display: flex; align-items: center; gap: 6px;
}
.checkin-progress { font-size: 13px; color: var(--text-light); }

.content { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: #c8e6f9; border-radius: 3px; }

/* 通用组件 */
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.card-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card-subtitle { font-size: 13px; color: var(--text-light); margin-bottom: 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border: none; border-radius: 12px; font-size: 15px;
  font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
  min-height: 44px; line-height: 1; color: #fff;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); }
.btn-warning { background: var(--warning); }
.btn-danger { background: var(--danger); }
.btn-light { background: var(--primary-light); color: var(--primary-dark); }
.btn-sm { padding: 6px 14px; font-size: 13px; min-height: 36px; }

.speak-btn {
  background: var(--primary-light); color: var(--primary-dark); border: none;
  width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.speak-btn:active { transform: scale(0.9); }

.tag {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 12px; font-weight: 600; margin-right: 6px;
}
.tag-blue { background: var(--primary-light); color: var(--primary-dark); }
.tag-green { background: #e8f5e9; color: #2e7d32; }
.tag-orange { background: #fff3e0; color: #e65100; }
.tag-purple { background: #f3e5f5; color: #7b1fa2; }

.checkin-btn {
  background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff;
  padding: 14px 32px; border: none; border-radius: 16px; font-size: 18px;
  font-weight: 700; cursor: pointer; width: 100%; transition: all 0.3s;
}
.checkin-btn:active { transform: scale(0.97); }
.checkin-btn.done { background: #e0e0e0; color: #888; cursor: default; }

/* 生字卡 */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.char-card {
  background: var(--card); border: 2px solid var(--primary-light); border-radius: 14px;
  padding: 14px 10px; text-align: center; transition: all 0.2s;
}
.char-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(74,158,255,0.15); }
.char-card .char { font-size: 32px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.char-card .pinyin { font-size: 14px; color: var(--primary); margin-bottom: 6px; }
.char-card .word { font-size: 12px; color: var(--text-light); }

/* 句子卡 */
.sentence-item {
  background: var(--card); border-left: 4px solid var(--primary); border-radius: 0 14px 14px 0;
  padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.04);
}
.sentence-item .text { font-size: 16px; line-height: 1.8; color: var(--text); }
.sentence-item .meta { font-size: 12px; color: var(--text-light); margin-top: 6px; }

/* 数学题 */
.math-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.math-item {
  background: var(--card); border: 2px solid #eee; border-radius: 10px;
  padding: 12px 8px; text-align: center;
}
.math-item .q { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.math-item input { width: 60px; text-align: center; border: 2px solid #ddd; border-radius: 8px; padding: 4px; font-size: 15px; }
.math-item input:focus { outline: none; border-color: var(--primary); }
.math-item.correct { border-color: var(--success); background: #f1f8e9; }
.math-item.wrong { border-color: var(--danger); background: #ffebee; }
.math-item .answer { font-size: 13px; color: var(--success); margin-top: 4px; display: none; }
.math-item.wrong .answer { display: block; }

/* 英语单词 */
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.word-card {
  background: var(--card); border: 2px solid var(--primary-light); border-radius: 12px;
  padding: 12px; text-align: center;
}
.word-card .en { font-size: 16px; font-weight: 700; color: var(--text); }
.word-card .ph { font-size: 12px; color: var(--primary); margin: 4px 0; }
.word-card .cn { font-size: 13px; color: var(--text-light); }

/* 英语阅读 */
.reading-box { background: var(--card); border-radius: var(--radius); padding: 24px; line-height: 2; font-size: 16px; }
.reading-box p { margin-bottom: 12px; }
.reading-box .new-word { color: var(--primary-dark); font-weight: 600; cursor: pointer; text-decoration: underline; }

/* 宠物中心 */
.pet-main { text-align: center; padding: 30px 20px; }
.pet-display { font-size: 80px; margin: 10px 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
.pet-name { font-size: 24px; font-weight: 700; color: var(--text); }
.pet-level { font-size: 16px; color: var(--primary); margin: 4px 0; }
.pet-stats { max-width: 400px; margin: 20px auto; }
.stat-bar { margin-bottom: 14px; }
.stat-bar .label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.stat-bar .bar-bg { height: 14px; background: #f0f0f0; border-radius: 7px; overflow: hidden; }
.stat-bar .bar-fill { height: 100%; border-radius: 7px; transition: width 0.5s; }
.bar-hunger { background: linear-gradient(90deg, #ff9800, #ffc107); }
.bar-happy { background: linear-gradient(90deg, #4caf50, #8bc34a); }
.bar-exp { background: linear-gradient(90deg, #4a9eff, #03a9f4); }

/* 录音/拍照 */
.upload-area {
  border: 2px dashed var(--primary); border-radius: 14px; padding: 20px;
  text-align: center; cursor: pointer; transition: all 0.2s; background: var(--primary-light);
}
.upload-area:hover { background: #d6eaff; }
.upload-area .icon { font-size: 36px; margin-bottom: 8px; }
.upload-area .text { font-size: 14px; color: var(--primary-dark); }
.upload-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 12px; }
.upload-preview img { width: 100%; border-radius: 10px; }

.record-btn {
  width: 64px; height: 64px; border-radius: 50%; border: none;
  background: var(--danger); color: #fff; font-size: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; margin: 10px auto;
  box-shadow: 0 4px 12px rgba(244,67,54,0.3); transition: all 0.2s;
}
.record-btn:active { transform: scale(0.92); }
.record-btn.recording { background: #888; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 4px 12px rgba(244,67,54,0.3); } 50% { box-shadow: 0 4px 24px rgba(244,67,54,0.6); } }

.audio-player { width: 100%; margin-top: 8px; }

/* 错题本 */
.wrong-item { background: #fff3e0; border-left: 4px solid var(--warning); border-radius: 0 10px 10px 0; padding: 12px; margin-bottom: 8px; }
.wrong-item .q { font-weight: 600; margin-bottom: 4px; }
.wrong-item .a { color: var(--success); }
.wrong-item .explain { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* 提示框 */
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 12px;
  font-size: 15px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* 空状态 */
.empty { text-align: center; padding: 40px; color: var(--text-light); font-size: 15px; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

/* iPad横屏优化 */
@media (min-width: 1024px) {
  :root { --nav-w: 180px; }
  .nav-item { width: 100%; flex-direction: row; justify-content: flex-start; padding: 12px 16px; gap: 10px; }
  .nav-item .icon { font-size: 20px; }
  .nav-item .label { font-size: 14px; }
  .sidebar { padding: 16px 8px; }
  .content { padding: 24px 32px; }
  .math-grid { grid-template-columns: repeat(8, 1fr); }
  .char-grid { grid-template-columns: repeat(5, 1fr); }
  .word-grid { grid-template-columns: repeat(4, 1fr); }
}

/* 手机适配 */
@media (max-width: 768px) {
  :root { --nav-w: 64px; }
  .nav-item .label { display: none; }
  .nav-item .icon { font-size: 24px; }
  .nav-logo { font-size: 24px; }
  .pet-mini .pet-lvl { display: none; }
  .topbar { padding: 10px 12px; min-height: 56px; }
  .day-badge { font-size: 14px; padding: 6px 12px; }
  .date-info { display: none; }
  .points-box { font-size: 13px; padding: 6px 10px; }
  .checkin-progress { display: none; }
  .content { padding: 12px; }
  .card { padding: 14px; border-radius: 14px; }
  .card-title { font-size: 18px; }
  .math-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .math-item .q { font-size: 14px; }
  .char-grid { grid-template-columns: repeat(2, 1fr); }
  .word-grid { grid-template-columns: repeat(2, 1fr); }
  .reading-box { padding: 16px; font-size: 15px; line-height: 1.8; }
  .pet-display { font-size: 60px; }
  .pet-name { font-size: 20px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- 左侧导航 -->
  <nav class="sidebar" id="sidebar">
    <div class="nav-logo">📚</div>

	<a class="nav‑link" href="https://1948421773.github.io/github.io/index.html" target="_blank">二年级作业</a>

      <div class="pet-emoji">🥚</div>

  <!-- 右侧主区域 -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="day-badge" id="dayBadge">第1天</div>
        <div class="date-info" id="dateInfo"></div>
      </div>
      <div class="topbar-right">
        <div class="checkin-progress" id="checkinProgress">今日 0/9</div>
        <div class="points-box">⭐ <span id="pointsDisplay">0</span> 分</div>

<script>
// ===================== 全局状态 =====================
let state = {
  day: 1,
  points: 0,
  checkins: {}, // {day: {module: true}}
  pet: { name: '小蓝', level: 1, exp: 0, hunger: 50, happy: 60, stage: 0 },
  uploads: {}, // {day_module: [base64]}
  recordings: {},
  wrongQuestions: [],
  petFeed: 0
};

const MODULES = ['chars','sentences','math','words','reading','physics','logic','poems','pet'];
const MODULE_NAMES = {
  chars:'生字专区', sentences:'句子积累', math:'数学计算', words:'英语单词',
  reading:'英语阅读', physics:'物理入门', logic:'数学思维', poems:'古诗诵读', pet:'小宠物'
};

// ===================== 持久化 =====================
function saveState() {
  try { localStorage.setItem('studyApp_v1', JSON.stringify(state)); } catch(e){}
}
function loadState() {
  try {
    const s = localStorage.getItem('studyApp_v1');
    if (s) { state = Object.assign(state, JSON.parse(s)); }
  } catch(e){}
}

// ===================== 日期 =====================
function getDayOfYear() {
  const start = new Date(new Date().getFullYear(), 6, 1); // 7月1日开始
  const now = new Date();
  let day = Math.floor((now - start) / 86400000) + 1;
  if (day < 1) day = 1;
  if (day > 30) day = ((day - 1) % 30) + 1;
  return day;
}
function formatDate() {
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week[d.getDay()]}`;
}

// ===================== 语音朗读 =====================
function speak(text, lang) {
  if (!window.speechSynthesis) { showToast('浏览器不支持语音'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'zh-CN';
  u.rate = 0.9;
  u.pitch = 1.1;
  window.speechSynthesis.speak(u);
}
function speakSeq(items, lang) {
  if (!window.speechSynthesis) { showToast('浏览器不支持语音'); return; }
  window.speechSynthesis.cancel();
  let i = 0;
  function next() {
    if (i >= items.length) return;
    const u = new SpeechSynthesisUtterance(items[i]);
    u.lang = lang || 'zh-CN';
    u.rate = 0.85;
    u.onend = () => { i++; setTimeout(next, 300); };
    window.speechSynthesis.speak(u);
  }
  next();
}

// ===================== 提示 =====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===================== 打卡 =====================
function isModuleChecked(module) {
  const dayData = state.checkins[state.day] || {};
  return dayData[module] || false;
}
function checkin(module) {
  if (!state.checkins[state.day]) state.checkins[state.day] = {};
  if (state.checkins[state.day][module]) { showToast('今日已打卡 ✓'); return false; }
  state.checkins[state.day][module] = true;
  state.points += 10;
  // 奖励饲料
  state.petFeed += 2;
  // 宠物经验
  addPetExp(5);
  saveState();
  updateTopbar();
  updatePetMini();
  showToast('✅ 打卡成功！+10积分 +2饲料');
  return true;
}
function getCheckinCount() {
  const d = state.checkins[state.day] || {};
  return MODULES.filter(m => d[m]).length;
}

// ===================== 宠物系统 =====================
const PET_STAGES = ['🥚','🐣','🐥','🐤','🐦','🦜','🦢','🦚','🐉'];
function addPetExp(n) {
  state.pet.exp += n;
  const need = state.pet.level * 50;
  while (state.pet.exp >= need) {
    state.pet.exp -= need;
    state.pet.level++;
    if (state.pet.stage < PET_STAGES.length - 1) state.pet.stage++;
    showToast(`🎉 宠物升级！现在是 Lv.${state.pet.level} ${PET_STAGES[state.pet.stage]}`);
  }
  saveState();
}
function feedPet() {
  if (state.petFeed <= 0) { showToast('没有饲料了，完成任务获取饲料'); return; }
  if (state.pet.hunger >= 100) { showToast('宠物已经吃饱啦~'); return; }
  state.petFeed--;
  state.pet.hunger = Math.min(100, state.pet.hunger + 20);
  state.pet.happy = Math.min(100, state.pet.happy + 10);
  addPetExp(8);
  updatePetUI();
  updatePetMini();
  showToast('🍎 喂养成功！宠物很开心~');
}
function playPet() {
  if (state.pet.happy >= 100) { showToast('宠物已经非常开心啦~'); return; }
  state.pet.happy = Math.min(100, state.pet.happy + 15);
  state.pet.hunger = Math.max(0, state.pet.hunger - 5);
  addPetExp(3);
  updatePetUI();
  updatePetMini();
  showToast('🎾 陪伴玩耍~');
}
function petDecay() {
  state.pet.hunger = Math.max(0, state.pet.hunger - 2);
  state.pet.happy = Math.max(0, state.pet.happy - 1);
  saveState();
}
function updatePetMini() {
  const el = document.getElementById('petMini');
  if (el) {
    el.querySelector('.pet-emoji').textContent = PET_STAGES[state.pet.stage];
    el.querySelector('.pet-lvl').textContent = `Lv.${state.pet.level}`;
  }
}
function updatePetUI() {
  if (currentPanel !== 'pet') return;
  renderPet();
}

// ===================== 录音 =====================
let mediaRecorder = null;
let audioChunks = [];
let currentRecordKey = '';
async function startRecord(key) {
  currentRecordKey = key;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      const reader = new FileReader();
      reader.onload = () => {
        if (!state.recordings[state.day]) state.recordings[state.day] = {};
        state.recordings[state.day][currentRecordKey] = reader.result;
        saveState();
        showToast('录音保存成功 ✓');
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    return true;
  } catch(e) { showToast('无法访问麦克风'); return false; }
}
function stopRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
}

// ===================== 拍照上传 =====================
function handleUpload(input, key) {
  const files = input.files;
  if (!files.length) return;
  if (!state.uploads[state.day]) state.uploads[state.day] = {};
  if (!state.uploads[state.day][key]) state.uploads[state.day][key] = [];
  const arr = state.uploads[state.day][key];
  const remain = 6 - arr.length;
  for (let i = 0; i < Math.min(remain, files.length); i++) {
    const reader = new FileReader();
    reader.onload = (e) => { arr.push(e.target.result); saveState(); };
    reader.readAsDataURL(files[i]);
  }
  showToast('上传成功 ✓');
}

// ===================== 数学计算 =====================
function genMathQ() {
  const types = [
    () => { // 两位数乘一位数
      const a = 10 + Math.floor(Math.random()*90);
      const b = 2 + Math.floor(Math.random()*8);
      return {q:`${a} × ${b} =`, a:a*b, t:'乘法'};
    },
    () => { // 三位数除以一位数
      const b = 2 + Math.floor(Math.random()*8);
      const a = (10 + Math.floor(Math.random()*90)) * b;
      return {q:`${a} ÷ ${b} =`, a:a/b, t:'除法'};
    },
    () => { // 两位数加减
      const a = 10 + Math.floor(Math.random()*90);
      const b = 10 + Math.floor(Math.random()*90);
      const op = Math.random()>0.5?'+':'-';
      const ans = op==='+'?a+b:a-b;
      return {q:`${a} ${op} ${b} =`, a:ans, t:'加减'};
    },
    () => { // 混合运算
      const a = 5 + Math.floor(Math.random()*15);
      const b = 2 + Math.floor(Math.random()*8);
      const c = 3 + Math.floor(Math.random()*7);
      return {q:`${a} × ${b} - ${c} =`, a:a*b-c, t:'混合'};
    },
    () => { // 带括号
      const a = 20 + Math.floor(Math.random()*80);
      const b = 5 + Math.floor(Math.random()*15);
      const c = 2 + Math.floor(Math.random()*8);
      return {q:`(${a} - ${b}) ÷ ${c} =`, a:Math.floor((a-b)/c), t:'括号', raw:(a-b)/c};
    }
  ];
  return types[Math.floor(Math.random()*types.length)]();
}

let mathQuestions = [];
function renderMath() {
  const c = document.getElementById('content');

  let seed = state.day * 12345;
  function rand() { seed = (seed*9301+49297)%233280; return seed/233280; }
  const oldRand = Math.random;
  Math.random = rand;
  mathQuestions = [];
  for (let i = 0; i < 40; i++) mathQuestions.push(genMathQ());
  Math.random = oldRand;

  let html = mathQuestions.map((q,i) => `

let mathTimer = null, mathSeconds = 0;
function startMathTimer() {
  if (mathTimer) { clearInterval(mathTimer); mathTimer = null; return; }
  mathSeconds = 0;
  mathTimer = setInterval(() => {
    mathSeconds++;
    const m = String(Math.floor(mathSeconds/60)).padStart(2,'0');
    const s = String(mathSeconds%60).padStart(2,'0');
    document.getElementById('mathTimer').textContent = `${m}:${s}`;
  }, 1000);
  showToast('计时开始！');
}
function checkMath(i) {
  const input = document.getElementById('math-input-'+i);
  const item = document.getElementById('math-'+i);
  const ans = mathQuestions[i].a;
  const val = parseFloat(input.value);
  item.classList.remove('correct','wrong');
  if (isNaN(val)) return;
  if (Math.abs(val - ans) < 0.01) {
    item.classList.add('correct');
  } else {
    item.classList.add('wrong');
  }
}
function checkAllMath() {
  if (mathTimer) { clearInterval(mathTimer); mathTimer = null; }
  let wrong = [];
  for (let i = 0; i < mathQuestions.length; i++) {
    checkMath(i);
    const input = document.getElementById('math-input-'+i);
    const val = parseFloat(input.value);
    if (isNaN(val) || Math.abs(val - mathQuestions[i].a) >= 0.01) {
      wrong.push({q: mathQuestions[i].q, a: mathQuestions[i].a, your: isNaN(val)?'未填':val});
    }
  }
  state.wrongQuestions = wrong;
  saveState();
  const list = document.getElementById('wrongList');
  if (wrong.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">🏆</div>全部正确！太棒了！</div>';
    showToast(`🎉 全部正确！用时 ${document.getElementById('mathTimer').textContent}`);
  } else {
    list.innerHTML = wrong.map(w => `
      <div class="wrong-item">
        <div class="q">${w.q}</div>
        <div>你的答案：<span style="color:#f44336">${w.your}</span> | 正确答案：<span class="a">${w.a}</span></div>
        <div class="explain">💡 ${getMathExplain(w.q)}</div>
      </div>
    `).join('');
    showToast(`批改完成：${mathQuestions.length - wrong.length}题正确，${wrong.length}题错误`);
  }
  // 检查是否全对，自动打卡
  if (wrong.length === 0 && !isModuleChecked('math')) {
    setTimeout(() => { checkin('math'); switchPanel('math'); }, 1000);
  }
}
function getMathExplain(q) {
  if (q.includes('×')) return '乘法运算：从右到左依次相乘，注意进位。';
  if (q.includes('÷')) return '除法运算：用乘法口诀验算，商×除数=被除数。';
  if (q.includes('括号')) return '有括号先算括号内的，再算括号外的。';
  return '仔细检查运算顺序和计算过程。';
}
function showAllAnswers() {
  for (let i = 0; i < mathQuestions.length; i++) {
    const item = document.getElementById('math-'+i);
    item.classList.add('wrong');
  }
}

  {title:'题临安邸',author:'林升',dynasty:'宋',text:'山外青山楼外楼，西湖歌舞几时休？\n暖风熏得游人醉，直把杭州作汴州。',trans:'山外有青山楼外有楼，西湖边的歌舞何时才能停止？\n暖洋洋的风把游人吹得醉醺醺的，简直把杭州当成了汴州。'},
  {title:'己亥杂诗',author:'龚自珍',dynasty:'清',text:'九州生气恃风雷，万马齐喑究可哀。\n我劝天公重抖擞，不拘一格降人材。',trans:'中国的生机活力全靠风雷般的变革，万马齐喑的局面实在可悲。\n我劝老天爷重新振作精神，打破常规降下各种人才。'},
  {title:'枫桥夜泊',author:'张继',dynasty:'唐',text:'月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。',trans:'月亮落下乌鸦啼叫霜气满天，对着江边枫树和渔火愁眠。\n姑苏城外寒山寺半夜的钟声，传到了客船上。'},
  {title:'长相思',author:'纳兰性德',dynasty:'清',text:'山一程，水一程，身向榆关那畔行，夜深千帐灯。\n风一更，雪一更，聒碎乡心梦不成，故园无此声。',trans:'翻山越岭跋山涉水，向榆关那边行进，夜深了营帐里点起千盏灯。\n风一阵雪一阵，风雪声搅碎了思乡的梦，故乡没有这样的声音。'},
  {title:'黄鹤楼送孟浩然之广陵',author:'李白',dynasty:'唐',text:'故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。',trans:'老朋友辞别西边的黄鹤楼，在繁花似锦的三月去扬州。\n孤帆的远影消失在碧空尽头，只看见长江水向天边流去。'}
];

function getPoemData() {
  return POEM_DATA[(state.day-1) % POEM_DATA.length];
}

function renderPoems() {
  const c = document.getElementById('content');
  const p = getPoemData();
  const poemText = p.text.split('\n').join('，');
  c.innerHTML = `
    <div class="card">
      <div class="card-title">📜 今日古诗</div>
      <div class="card-subtitle">第${state.day}天 · ${p.dynasty}·${p.author}《${p.title}》</div>
      <button class="btn btn-primary" onclick="speakSeq(['${p.title}','${poemText}'],'zh-CN')">🔊 朗读全诗</button>
    </div>
    <div class="card" style="text-align:center;padding:30px">
      <h2 style="font-size:28px;margin-bottom:6px">${p.title}</h2>
      <div style="font-size:14px;color:#888;margin-bottom:20px">${p.dynasty} · ${p.author}</div>
      <div style="font-size:22px;line-height:2;letter-spacing:2px">${p.text.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="card" style="background:var(--primary-light)">
      <div class="card-title" style="color:var(--primary-dark)">📖 译文</div>
      <div style="font-size:16px;line-height:2">${p.trans.replace(/\n/g,'<br>')}</div>
    </div>
    ${renderRecordArea('poems','古诗诵读')}
    <div class="card">${renderCheckinBtn('poems')}</div>
  `;
}

// ===================== 宠物中心 =====================
function renderPet() {
  const c = document.getElementById('content');
  const p = state.pet;
  const need = p.level * 50;
  c.innerHTML = `
    <div class="card pet-main">
      <div class="pet-display">${PET_STAGES[p.stage]}</div>
      <div class="pet-name">${p.name}</div>
      <div class="pet-level">Lv.${p.level} · 还需${need - p.exp}经验升级</div>
      <div style="margin-top:12px;font-size:14px;color:#888">饲料库存：${state.petFeed} 🍎</div>
    </div>
    <div class="card">
      <div class="card-title">📊 宠物状态</div>
      <div class="pet-stats">
        <div class="stat-bar">
          <div class="label"><span>🍎 饱食度</span><span>${p.hunger}/100</span></div>
          <div class="bar-bg"><div class="bar-fill bar-hunger" style="width:${p.hunger}%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="label"><span>😊 心情值</span><span>${p.happy}/100</span></div>
          <div class="bar-bg"><div class="bar-fill bar-happy" style="width:${p.happy}%"></div></div>
        </div>
        <div class="stat-bar">
          <div class="label"><span>⭐ 经验值</span><span>${p.exp}/${need}</span></div>
          <div class="bar-bg"><div class="bar-fill bar-exp" style="width:${p.exp/need*100}%"></div></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
        <button class="btn btn-success" onclick="feedPet()">🍎 喂食</button>
        <button class="btn btn-primary" onclick="playPet()">🎾 玩耍</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📜 宠物成长日志</div>
      <div style="font-size:14px;line-height:1.8;color:#666">
        🥚 Lv.1-2：刚出生的小蛋蛋<br>
        🐣 Lv.3-4：破壳而出的小雏鸟<br>
        🐥 Lv.5-6：毛茸茸的小黄鸡<br>
        🐦 Lv.7-8：学会飞翔的小鸟<br>
        🐉 Lv.9+：进化成神龙啦！
      </div>
    </div>
    <div class="card">
      <div class="card-title">💡 获取饲料</div>
      <div style="font-size:15px;line-height:1.8">完成每日学习打卡，每个模块获得 <b>2个饲料</b> 和 <b>5点经验</b>。每天最多可获得 <b>16个饲料</b>。好好照顾你的小宠物吧！</div>
    </div>
  `;
}

// ===================== 初始化 =====================
function init() {
  loadState();
  state.day = getDayOfYear();
  updateTopbar();
  updatePetMini();
  renderHome();
  // 宠物衰减定时器
  setInterval(petDecay, 60000); // 每分钟衰减
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
